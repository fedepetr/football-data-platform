# Raw table rebuilt by src/fdp/ingest/couk.py from every season CSV:
# one row per match, all columns as text, aligned by name across seasons.
sources:
  - name: raw
    schema: raw
    tables:
      - name: couk_matches
        description: >
          **Grain:** one row per match, one CSV line of football-data.co.uk. **Key:** Div + Date + HomeTeam + AwayTeam (no id in the source).

          football-data.co.uk match results and statistics (Serie A I1, Premier League E0).
