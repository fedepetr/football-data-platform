models:
  - name: mart_player_profile
    description: >
      Player card per season: personal data, main team, appearances, goals,
      assists, cards and end-of-season market value. Transfermarkt for 2024/25 and
      2025/26 (every player who played), football-data.org for 2026/27 (scorers
      only: the free plan has no line-ups). stats_source tells which.
    data_tests:
      - unique:
          arguments:
            column_name: "player_key || '_' || season_key"
    columns:
      - name: player_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: season_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: team_key
        description: Team where the player played most minutes (matches for 2026/27).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: teams
        description: Number of project teams the player played for in the season.
      - name: minutes_played
        description: NULL for football-data.org seasons (no minutes in the source).
      - name: market_value_eur
        description: Last Transfermarkt valuation on or before the season's last fixture.
      - name: stats_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["transfermarkt", "fdorg"]
      - name: competition_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key

  - name: mart_similar_players
    description: >
      For each player and completed season (at least 900 minutes), the 5 most
      similar players of the same position by statistics per 90 minutes
      (goals, assists, yellow and red cards, share of minutes), standardised as
      z-scores within season and position over both leagues. Two scopes:
      all_competitions (both leagues) and same_competition (the player's league).
      Distance is Euclidean; similarity is 100 / (1 + distance).
    data_tests:
      - unique:
          arguments:
            column_name: "player_key || '_' || season_key || '_' || comparison_scope || '_' || similarity_rank"
    columns:
      - name: player_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: season_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: competition_key
        description: League where the player played most minutes in the season.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key
      - name: comparison_scope
        description: all_competitions (both leagues) or same_competition (player's league only).
        data_tests:
          - accepted_values:
              arguments:
                values: ["all_competitions", "same_competition"]
      - name: similar_player_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: similar_competition_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_competition')
                field: competition_key
      - name: similarity_rank
        description: 1 = most similar, within the scope.
        data_tests: [not_null]
      - name: position
        data_tests:
          - accepted_values:
              arguments:
                values: ["Goalkeeper", "Defender", "Midfield", "Attack"]
