seeds:
  - name: team_map
    description: >
      **Grain:** one row per team and source. **Key:** team_key + source.

      Hand-reviewed team map, one row per team and source.
      Drafted by `uv run python -m fdp.matching.team_map` (names with ordered
      letters + fixture votes), then reviewed: every "review" row was checked and
      Coventry City / transfermarkt was removed (club not in the Transfermarkt
      dataset; the draft had matched it to Leicester City).
    config:
      column_types:
        # Mixed values: football-data.org and Transfermarkt ids, couk names.
        source_team_ref: varchar
    data_tests:
      # One reference per team and source.
      - unique:
          arguments:
            column_name: "team_key || '_' || source"
    columns:
      - name: team_key
        description: Project team key, a readable slug (e.g. man_united).
        data_tests: [not_null]
      - name: source
        description: fdorg, couk or transfermarkt.
        data_tests:
          - accepted_values:
              arguments:
                values: ["fdorg", "couk", "transfermarkt"]
      - name: source_team_ref
        description: Team id (fdorg, transfermarkt) or team name (couk) in that source.
        data_tests: [not_null]

  - name: competition_map
    description: >
      **Grain:** one row per competition. **Key:** competition_key.

      Competitions in scope with their code in each source. Mirrors the
      `competitions` list of config/pipeline.yaml (tests/test_config.py checks
      they agree, so the Python ingestion and dbt cannot drift apart).
    columns:
      - name: competition_key
        description: Project competition key, e.g. serie_a.
        data_tests: [unique, not_null]
      - name: fdorg_code
        data_tests: [unique, not_null]
      - name: couk_code
        data_tests: [unique, not_null]
      - name: tm_competition_id
        data_tests: [unique, not_null]

  - name: player_corrections
    description: >
      **Grain:** one row per reviewed football-data.org player. **Key:** fdorg_person_id.

      Manual decisions of the player reconciliation, re-read at every run by
      src/fdp/matching/player_map.py (not by dbt models: loaded as a seed so the
      decisions are visible and versioned). An empty tm_player_id means the player
      has no match; note says why.
    data_tests:
      - unique:
          arguments:
            column_name: fdorg_person_id
    columns:
      - name: fdorg_person_id
        description: football-data.org person id of the reviewed player.
        data_tests: [not_null]
      - name: tm_player_id
        description: Transfermarkt player id confirmed by hand; empty for "no match".
      - name: note
        description: Why the decision was taken (nickname, birth date typo, reverse check...).
