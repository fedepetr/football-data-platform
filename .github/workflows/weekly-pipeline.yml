# Weekly pipeline run, the same day as the Dagster schedule (config/pipeline.yaml).
# GitHub runners start empty and keep nothing between runs, so the whole platform
# is rebuilt from scratch (all seasons, three sources, matching, dbt with its
# tests): about 5 minutes, always reproducible. A deployment with persistent
# storage would run the Dagster schedule instead, refreshing the current season only.
name: Weekly pipeline

on:
  schedule:
    # Tuesday 06:00 UTC (GitHub cron is always UTC).
    - cron: "0 6 * * 2"
  # Manual run from the Actions tab.
  workflow_dispatch:

# Least privilege: write access only where needed.
permissions:
  contents: write   # publish the demo data release
  pages: write      # publish the dbt documentation on GitHub Pages
  id-token: write   # required by the GitHub Pages deployment

# Never two runs at once.
concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository secret (Settings > Secrets and variables > Actions), never in files.
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Parse dbt project
        run: uv run --directory dbt dbt parse

      # 1. Seasonal sources, every season in one run (single-run backfill policy).
      - name: Ingest football-data.org and football-data.co.uk
        run: >
          uv run dagster asset materialize -m fdp.definitions
          --select "group:fdorg or group:couk" --partition-range "2425...2627"

      # 2. Transfermarkt snapshot (not partitioned).
      - name: Ingest Transfermarkt
        run: >
          uv run dagster asset materialize -m fdp.definitions
          --select "group:transfermarkt"

      # 3. Everything downstream: player matching (with its blocking check) and
      #    dbt staging, core and marts with their tests. A failed test fails the run.
      - name: Match players and build dbt models
        run: >
          uv run dagster asset materialize -m fdp.definitions
          --select "not (group:fdorg or group:couk or group:transfermarkt)"

      # 4. The demo app against the rebuilt database: data contract and every page.
      #    These tests are skipped in the pull request CI, which has no data.
      - name: Test the demo app
        run: |
          uv sync --locked --group demo
          uv run --group demo pytest tests/test_app.py -v

      # 5. Publish the demo data: one Parquet file per contract table, attached to
      #    the `demo-data` release (public download URLs, unlike artifacts). Files are
      #    replaced every week; the online app reads them from FDP_DEMO_DATA_URL.
      - name: Publish demo data
        env:
          # Token of this run, used by the GitHub CLI (preinstalled on runners).
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python app/export_parquet.py
          gh release view demo-data > /dev/null 2>&1 || gh release create demo-data \
            --title "Demo data (updated weekly)" \
            --notes "Parquet files read by the online demo app. Replaced by the weekly pipeline." \
            --prerelease
          gh release upload demo-data data/demo/*.parquet --clobber

      # 6. dbt documentation: one self-contained HTML page (models, columns, tests,
      #    lineage graph), built on the fresh database so it includes the catalog
      #    (column types and row counts). Deployed to GitHub Pages by the next job.
      - name: Generate dbt documentation
        run: |
          uv run --directory dbt dbt docs generate --static
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      - name: Upload documentation for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Upload database and dbt results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: football-data-platform-${{ github.run_number }}
          path: |
            data/fdp.duckdb
            dbt/target/run_results.json
          retention-days: 30

  # Publish the dbt documentation (https://fedepetr.github.io/football-data-platform/).
  # A separate job: GitHub Pages deployments run in the `github-pages` environment.
  docs:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
