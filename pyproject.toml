[project]
name = "fdp"
version = "0.1.0"
description = "football data platform"
readme = "README.md"
authors = [
    { name = "Federico Petraccia", email = "federico.petraccia95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.27",
    "dagster-dbt>=0.29.27",
    "dagster-webserver>=1.13.27",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "unidecode>=1.4.0",
]


[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.dagster]
# `uv run dagster dev` loads the Dagster definitions from this module.
module_name = "fdp.definitions"
