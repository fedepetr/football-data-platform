[project]
name = "fdp"
version = "0.1.0"
description = "football data platform"
readme = "README.md"
authors = [
    { name = "Federico Petraccia", email = "federico.petraccia95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]