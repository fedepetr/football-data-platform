# Pipeline configuration: what is loaded and with which limits.
# Secrets (API tokens) never go here: they live in .env.

# Seasons in scope, as 4-digit codes. Quoted: unquoted 2627 would be read as a number.
seasons: ["2425", "2526", "2627"]
# Season in progress, refreshed weekly.
current_season: "2627"

# One entry per competition, with its code in each source.
competitions:
  - name: Serie A
    fdorg: SA
    couk: I1
    transfermarkt: IT1
  - name: Premier League
    fdorg: PL
    couk: E0
    transfermarkt: GB1

sources:
  fdorg:
    base_url: https://api.football-data.org/v4
    requests_per_minute: 10 # free tier limit
    timeout_seconds: 30
    retry:
      max_attempts: 4
      backoff_base_seconds: 10 # waits 10, 20, 40 seconds
    # Endpoint name -> path template, arrival checks and extra query parameters.
    # The name is used for the raw file (SA_matches.json) and table (raw.fdorg_matches).
    # Arrival checks: the response must contain the list `items_key`
    # with at least `min_items` elements (and fewer than `limit`, if set).
    endpoints:
      matches:
        path: /competitions/{competition}/matches
        items_key: matches
        min_items: 380 # 20-team league: full fixture list, even mid-season
      teams:
        path: /competitions/{competition}/teams
        items_key: teams
        min_items: 20
      scorers:
        path: /competitions/{competition}/scorers
        items_key: scorers
        min_items: 1 # varies during the season; empty means a problem
        params:
          limit: 1000 # default is 10: raise it to get every player with a goal

  couk:
    # Files are at <base_url>/<season>/<competition>.csv, e.g. .../2627/I1.csv.
    # Season codes match the project ones: no conversion needed.
    base_url: https://www.football-data.co.uk/mmz4281
    timeout_seconds: 30
    # Arrival checks on each CSV: these columns must exist, with at least `min_rows` matches.
    # Only 1 row: the current season holds played matches only (0 before kickoff).
    # Completeness (380 matches per finished season) is a dbt test in phase 3.
    min_rows: 1
    required_columns: [Div, Date, HomeTeam, AwayTeam, FTHG, FTAG, FTR]

  transfermarkt:
    # Public files of dcaribou/transfermarkt-datasets: <base_url>/<table>.csv.gz.
    # No credentials needed (Kaggle davidcariboo/player-scores is the alternative).
    # Snapshot frozen on 2026-07-06: no 2026/27 data.
    base_url: https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data
    timeout_seconds: 120 # appearances is ~45 MB
    min_rows: 1
    # Tables loaded once, in this order: appearances is filtered on the loaded games.
    # `required_columns` are the arrival checks: at least the key of each table.
    # `scope`: games and appearances keep only competitions and seasons in scope;
    # every other table is loaded in full (as the brief asks for players).
    tables:
      competitions:
        required_columns: [competition_id]
      clubs:
        required_columns: [club_id]
      players:
        required_columns: [player_id, name, date_of_birth]
      games:
        required_columns: [game_id, competition_id, season]
        scope: games
      appearances:
        required_columns: [appearance_id, game_id, player_id]
        scope: appearances
      player_valuations:
        required_columns: [player_id, date, market_value_in_eur]
      transfers:
        required_columns: [player_id, transfer_date]
